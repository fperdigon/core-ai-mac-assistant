name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/scan-secrets.sh
      - run: sh scripts/test-scan-secrets.sh
      - run: swift build
      - run: swift test
      - name: Check Apache-2.0 headers
        run: |
          sh scripts/check-license-headers.sh
          sh scripts/test-check-license-headers.sh
