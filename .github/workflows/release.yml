name: Release

# Tags publish stable releases; every main commit publishes a distinct nightly.
# Manual dispatch follows the selected ref, just like a push.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_CHANNEL: ${{ github.ref_type == 'tag' && 'stable' || github.ref_name == 'main' && 'nightly' || 'dev' }}
      KEEP_NIGHTLIES: ${{ vars.KEEP_NIGHTLIES || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag matches app version
        if: github.ref_type == 'tag'
        run: |
          version="$(cat VERSION)"
          # Info.plist is a template; make-app-bundle.sh resolves @VERSION@ from VERSION.
          plist_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          test "$plist_version" = '@VERSION@'
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo '::error::Release tag must match VERSION and the bundle version.'
            exit 1
          fi
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
      - name: Run tests
        run: |
          swift test
          python3 -m unittest discover -s scripts/tests -v
      - name: Build and verify DMG
        run: scripts/build-release.sh
      - name: Check built release version
        if: github.ref_type == 'tag'
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'build/MacPocketKnife.app/Contents/Info.plist')"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Disk usage after build
        if: always()
        run: df -h /
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        run: |
          prev_tag="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo 'Unsigned (ad-hoc signed, not notarized). On first launch, right-click > Open.'
            echo
            if [ -n "$prev_tag" ]; then
              echo "## Changes since $prev_tag"
            else
              echo '## Changes'
            fi
            echo
            scripts/release-notes.sh "$prev_tag" "$GITHUB_REF_NAME"
            if [ -n "$prev_tag" ]; then
              echo
              echo "**Full diff:** https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${GITHUB_REF_NAME}"
            fi
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
      - name: Publish nightly pre-release
        if: github.ref_type != 'tag'
        run: scripts/publish-nightly.sh
