name: Release

# Tags publish stable releases; every main commit publishes a distinct nightly.
# Manual dispatch follows the selected ref, just like a push.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_CHANNEL: ${{ github.ref_type == 'tag' && 'stable' || github.ref_name == 'main' && 'nightly' || 'dev' }}
      KEEP_NIGHTLIES: ${{ vars.KEEP_NIGHTLIES || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag matches app version
        if: github.ref_type == 'tag'
        run: |
          version="$(cat VERSION)"
          # Info.plist is a template; make-app-bundle.sh resolves @VERSION@ from VERSION.
          plist_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          test "$plist_version" = '@VERSION@'
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo '::error::Release tag must match VERSION and the bundle version.'
            exit 1
          fi
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
      - name: Run tests
        run: |
          swift test
          python3 -m unittest discover -s scripts/tests -v
      - name: Build and verify DMG
        run: scripts/build-release.sh
      - name: Check built release version
        if: github.ref_type == 'tag'
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'build/MacPocketKnife.app/Contents/Info.plist')"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Disk usage after build
        if: always()
        run: df -h /
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        run: |
          prev_tag="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo 'Ad-hoc signed, not notarized. Install with Homebrew (brew install --cask fperdigon/tap/macpocketknife) or see the README for the first-launch steps (System Settings > Privacy & Security > Open Anyway).'
            echo
            if [ -n "$prev_tag" ]; then
              echo "## Changes since $prev_tag"
            else
              echo '## Changes'
            fi
            echo
            scripts/release-notes.sh "$prev_tag" "$GITHUB_REF_NAME"
            if [ -n "$prev_tag" ]; then
              echo
              echo "**Full diff:** https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${GITHUB_REF_NAME}"
            fi
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
      - name: Notify Homebrew tap
        if: github.ref_type == 'tag'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo '::notice::HOMEBREW_TAP_TOKEN is not set; the Homebrew tap will pick up this release on its daily run.'
            exit 0
          fi

          version="${GITHUB_REF_NAME#v}"
          if response="$(GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh api --include \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            repos/fperdigon/homebrew-tap/dispatches \
            -f event_type=macpocketknife-release -f "client_payload[version]=$version" 2>&1)"; then
            echo '::notice::Homebrew tap notified successfully.'
            exit 0
          fi

          status="$(printf '%s\n' "$response" | sed -nE 's/^(HTTP\/[^ ]+ [0-9]{3}.*)$/\1/p' | head -n 1)"
          if [ -z "$status" ]; then
            status='HTTP status unavailable'
          fi
          message="$(printf '%s\n' "$response" | sed '1,/^[[:space:]]*$/d' | sed '/^[[:space:]]*$/d' | tr -d '\r' | tail -n 1 | cut -c1-300)"
          if [ -z "$message" ]; then
            message="$(printf '%s\n' "$response" | sed '/^[[:space:]]*$/d' | tr -d '\r' | tail -n 1 | cut -c1-300)"
          fi
          if [ -z "$message" ]; then
            message='API error message unavailable'
          fi
          echo "::warning::Homebrew tap dispatch failed ($status): $message; the tap will pick up this release on its daily run."
          exit 0
      - name: Publish nightly pre-release
        if: github.ref_type != 'tag'
        run: scripts/publish-nightly.sh
