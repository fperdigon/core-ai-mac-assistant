name: Notify Homebrew tap

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to send (optional; omit to test the notification link)
        required: false
        default: ''

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release event to Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo '::warning::HOMEBREW_TAP_TOKEN is not set; no Homebrew tap dispatch was sent.'
            exit 0
          fi

          version="${VERSION_INPUT#v}"
          response="$(GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh api --include repos/fperdigon/homebrew-tap/dispatches \
            -f event_type=macpocketknife-release -f "client_payload[version]=$version" 2>&1)"
          result=$?
          if [ "$result" -eq 0 ]; then
            echo '::notice::Homebrew tap dispatch succeeded.'
            exit 0
          fi

          status="$(printf '%s\n' "$response" | sed -nE 's/^(HTTP\/[^ ]+ [0-9]{3}.*)$/\1/p' | head -n 1)"
          if [ -z "$status" ]; then
            status='HTTP status unavailable'
          fi
          echo "::warning::Homebrew tap dispatch failed ($status)."
          exit 0
